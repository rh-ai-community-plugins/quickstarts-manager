{{- if and .Values.bff.enabled .Values.bff.rbac.create }}
# NOTE: The BFF currently uses the user's forwarded Bearer token for all Helm
# and K8s operations (automountServiceAccountToken is false). This ClusterRole
# defines the permissions the BFF SA would need if SA-based operations are
# enabled in the future, and documents the resource scope of quickstart charts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "quickstarts-manager.fullname" . }}-bff
  labels:
    {{- include "quickstarts-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff
rules:
  # Namespaces: create via helm install --create-namespace; no delete
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Manage workload resources created by quickstart Helm charts
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Manage core resources created by quickstart Helm charts
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Helm stores release state in secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Manage namespace-scoped RBAC resources created by quickstart Helm charts
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Manage networking resources created by quickstart Helm charts
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Discover and manage OpenShift Routes created by quickstart Helm charts
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # RBAC pre-checks via SelfSubjectAccessReview
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
{{- end }}
